# Hugo versions this theme supports: the current Ubuntu LTS release and newer.
module:
  hugoVersion:
    min: "0.154.5"

# llms.txt (https://llmstxt.org) from layouts/home.llmtxt.txt.
# Hugo merges `outputFormats` from the theme but never `outputs`: add `llmtxt`
# to the site's `outputs.home` to get /llms.txt.
outputFormats:
  llmtxt:
    baseName: llms
    mediaType: text/plain
    isPlainText: true
    notAlternative: true
    permalinkable: false

params:
  search:
    enable: true
  comments:
    giscus:
      enable: false
  toc:
    enable: true
    minWordCount: 400
  relatedPostsCount: 3
