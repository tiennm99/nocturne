<header class="site-header">
  <a class="site-title" href="{{ site.Home.RelPermalink }}">
    {{- with (partial "compat/data.html" .).profile }}{{ .name | default site.Title }}{{ else }}{{ site.Title }}{{ end -}}
  </a>
  {{ partial "nav.html" . }}
  <div class="site-header-actions">
    {{ partial "lang-switcher.html" . }}
    {{- if site.Params.search.enable | default true }}
    {{ partial "search-button.html" . }}
    {{- end }}
    <button type="button" class="theme-toggle" aria-label="{{ i18n "toggleTheme" | default "Toggle theme" }}" aria-pressed="false" data-theme-toggle hidden>
      <span class="theme-icon-moon">{{ partialCached "icon.html" "moon" "moon" }}</span><span class="theme-icon-sun">{{ partialCached "icon.html" "sun" "sun" }}</span>
    </button>
  </div>
</header>
