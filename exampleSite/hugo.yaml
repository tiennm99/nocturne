# Demo site for the nocturne theme, deployed to GitHub Pages by
# .github/workflows/pages.yml. It loads the theme from this repo's root
# (themesDir ../.. resolves to the directory that holds the checkout).
# Every theme param is switched on here, so the demo shows each feature.
baseURL: https://tiennm99.github.io/nocturne/
languageCode: en
defaultContentLanguage: en
title: nocturne
themesDir: ../..
theme: nocturne
enableRobotsTXT: true

# English at the root, Vietnamese under /vi/. A post's translation is a
# sibling file in its bundle (index.vi.md next to index.md).
languages:
  en:
    languageName: English
    languageCode: en
    title: nocturne
    weight: 1
    menus:
      main:
        - name: Posts
          pageRef: /post
          weight: 10
        - name: Archives
          pageRef: /archives
          weight: 20
        - name: About
          pageRef: /about
          weight: 30
  vi:
    languageName: Tiếng Việt
    languageCode: vi
    title: nocturne
    weight: 2
    menus:
      main:
        - name: Bài viết
          pageRef: /post
          weight: 10
        - name: Lưu trữ
          pageRef: /archives
          weight: 20
        - name: Giới thiệu
          pageRef: /about
          weight: 30
    params:
      comments:
        giscus:
          lang: en

pagination:
  pagerSize: 5
  path: page

taxonomies:
  category: categories
  tag: tags

permalinks:
  post: /:year/:month/:day/:slugorcontentbasename/

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      autoHeadingIDType: github-ascii
      # Block images become <figure> with a caption, and {#id .class}
      # attributes work on images and paragraphs, not only headings.
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 60
    - name: date
      weight: 10

outputs:
  home: [html, rss, llmtxt]

params:
  description: Demo site for nocturne, a Hugo blog and personal portfolio theme.
  author: Your Name
  favicon: favicon.svg
  mainSections: [post]
  showWordCount: true
  rssFullContent: true
  og:
    fallbackImage: img/og-default.png
  search:
    enable: true
  home:
    recentPostsCount: 5
  toc:
    enable: true
    minWordCount: 400
  relatedPostsCount: 3
  prevNextNav:
    enable: true
    taxonomy: categories      # a post in a series links to the series' other posts
  categoryChip:
    enable: true
  prefetch:
    enable: true
  footer:
    since: 2025
    customText: 'Demo content for the <a href="https://github.com/tiennm99/nocturne">nocturne</a> Hugo theme.'
  license: "Licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"
  editURL: https://github.com/tiennm99/nocturne/edit/main/exampleSite/content/
  comments:
    giscus:
      enable: true
      repo: tiennm99/nocturne
      repoId: R_kgDOV1Vj5w
      category: Announcements
      categoryId: DIC_kwDOV1Vj584DLkwp
      mapping: pathname
      lang: vi
