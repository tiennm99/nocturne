# Demo site for the nocturne theme, deployed to GitHub Pages by
# .github/workflows/pages.yml. It loads the theme from this repo's root
# (themesDir ../.. resolves to the directory that holds the checkout).
baseURL: https://tiennm99.github.io/nocturne/
languageCode: vi
defaultContentLanguage: vi
title: nocturne
themesDir: ../..
theme: nocturne

pagination:
  pagerSize: 10
  path: page

taxonomies:
  category: categories
  tag: tags

permalinks:
  post: /:year/:month/:day/:contentbasename/

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      autoHeadingIDType: github-ascii
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 60
    - name: date
      weight: 10

outputs:
  home: [html, rss, llmtxt]

menus:
  main:
    - name: Bài viết
      pageRef: /post
      weight: 10
    - name: Lưu trữ
      pageRef: /archives
      weight: 20

params:
  description: Demo site for nocturne, a Hugo blog and personal portfolio theme.
  favicon: favicon.svg
  search:
    enable: true
  prevNextNav:
    enable: true
  footer:
    since: 2025
  license: "Licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"
